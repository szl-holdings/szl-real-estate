name: hf-space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Push Docker Space SZLHOLDINGS/szl-real-estate
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          token = os.environ.get("HF_TOKEN") or ""
          if not token:
              print("HF_TOKEN UNAVAILABLE — Space publish skipped. Not fabricated LIVE.")
              sys.exit(0)
          from huggingface_hub import HfApi, create_repo
          api = HfApi(token=token)
          create_repo("SZLHOLDINGS/szl-real-estate", repo_type="space", space_sdk="docker", exist_ok=True, token=token)
          api.upload_folder(
              folder_path=".",
              repo_id="SZLHOLDINGS/szl-real-estate",
              repo_type="space",
              ignore_patterns=[".git*", "tests/*", ".venv/*"],
          )
          print("published SZLHOLDINGS/szl-real-estate")
          PY
