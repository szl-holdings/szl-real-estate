name: Verify central Hugging Face publication ownership

# Provider writes belong to the protected szl-holdings/.github publisher because
# reusable workflows inherit the caller repository's secret scope. This workflow
# never handles provider credentials; it proves the central lane still owns this
# exact source/target pair and emits an immutable delegation receipt.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hf-space.yml
      - Dockerfile
      - app.py
      - index.html
      - requirements.txt
      - README.md
      - szl_re/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-central-delegation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify central exact-source publisher contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact source event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current protected publication owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: main
          path: governance
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Prove delegation and emit receipt
        shell: bash
        env:
          EXPECTED_REPO: szl-real-estate
          EXPECTED_HF_REPO: SZLHOLDINGS/szl-real-estate
          EXPECTED_SMOKE_PATHS: '["/"]'
          SOURCE_WORKFLOW: .github/workflows/hf-space.yml
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -I -P <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ['EXPECTED_REPO']
          hf_repo = os.environ['EXPECTED_HF_REPO']
          smoke = os.environ['EXPECTED_SMOKE_PATHS']
          source_workflow = Path('source') / os.environ['SOURCE_WORKFLOW']
          central_workflow = Path('governance/.github/workflows/publish-operator-spaces.yml')

          source_text = source_workflow.read_text(encoding='utf-8')
          central_text = central_workflow.read_text(encoding='utf-8')
          source_sha = subprocess.check_output(
              ['git', '-C', 'source', 'rev-parse', '--verify', 'HEAD'], text=True
          ).strip()
          central_sha = subprocess.check_output(
              ['git', '-C', 'governance', 'rev-parse', '--verify', 'HEAD'], text=True
          ).strip()
          sha_pattern = re.compile(r'^[0-9a-f]{40}$')
          if not sha_pattern.fullmatch(source_sha) or not sha_pattern.fullmatch(central_sha):
              raise SystemExit('source identities must be exact 40-character commit SHAs')

          forbidden_patterns = {
              'local Hugging Face provider secret': re.compile(
                  r'(?m)^\s+HF_TOKEN:\s*\$\{\{\s*secrets\.HF_'
              ),
              'caller-scoped reusable provider publisher': re.compile(
                  r'(?m)^\s+uses:\s*szl-holdings/\.github/\.github/workflows/'
                  r'reusable-hf-deploy\.yml@'
              ),
          }
          present = [
              name for name, pattern in forbidden_patterns.items()
              if pattern.search(source_text)
          ]
          if present:
              raise SystemExit(f'caller still attempts provider publication: {present!r}')

          required_global = (
              'schedule:',
              "if: github.event_name != 'pull_request'",
              '--require-default-branch-tip',
              '--restart-space',
              '--attest',
              '--wait-running 1200',
              'secrets.HF_ORG_TOKEN',
              'secrets.HF_ORG_TOKEN1',
              'secrets.HF_TOKEN',
              'secrets.HF_WRITE_TOKEN',
          )
          missing = [item for item in required_global if item not in central_text]
          if missing:
              raise SystemExit(f'central publisher controls missing: {missing!r}')
          if 'environment: production' in central_text:
              raise SystemExit('central publisher is stalled behind a duplicate environment review')

          entry = re.compile(
              rf'-\s+repo:\s*{re.escape(repo)}\s*\n'
              rf'\s+hf_repo:\s*{re.escape(hf_repo)}\s*\n'
              rf"\s+smoke_paths:\s*'{re.escape(smoke)}'"
          )
          if not entry.search(central_text):
              raise SystemExit(f'central publisher does not own {repo} -> {hf_repo}')

          receipt = {
              'schema': 'szl.hf.central-delegation.v1',
              'state': 'DELEGATED',
              'source_repository': f'szl-holdings/{repo}',
              'source_sha': source_sha,
              'publisher_repository': 'szl-holdings/.github',
              'publisher_sha': central_sha,
              'publisher_workflow': '.github/workflows/publish-operator-spaces.yml',
              'hf_repository': hf_repo,
              'smoke_paths': json.loads(smoke),
              'source_workflow_sha256': hashlib.sha256(source_text.encode()).hexdigest(),
              'publisher_workflow_sha256': hashlib.sha256(central_text.encode()).hexdigest(),
              'provider_credentials_local': False,
              'default_tip_guard_required': True,
              'restart_required': True,
              'live_attestation_required': True,
          }
          Path('evidence/hf-central-delegation.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload immutable delegation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-central-delegation-${{ github.sha }}
          path: evidence/hf-central-delegation.json
          if-no-files-found: error
          retention-days: 90
