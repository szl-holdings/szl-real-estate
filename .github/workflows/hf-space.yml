name: Verify canonical Terra publication ownership

# Run for every source change, including additions of other workflows or scripts.
# Provider publication is owned by A11oy; this workflow only verifies delegation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-terra-delegation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical Terra surface owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact product source event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current protected estate governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: main
          path: governance
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current protected runtime publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/a11oy
          ref: main
          path: publisher
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Test delegation verification boundaries
        run: python3 -I -B source/tests/test_verify_terra_delegation.py

      - name: Prove governance and publisher delegation
        run: >-
          python3 -I -B source/scripts/verify_terra_delegation.py
          --source source --governance governance --publisher publisher
          --output evidence/hf-canonical-terra-delegation.json

      - name: Upload immutable delegation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-canonical-terra-delegation-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/hf-canonical-terra-delegation.json
          if-no-files-found: error
          retention-days: 90
