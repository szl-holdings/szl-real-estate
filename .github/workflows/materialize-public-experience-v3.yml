name: Stage SZL Public Experience v3 locally

on:
  push:
    branches:
      - automation/local-public-experience-v3-20260903
    paths:
      - .github/workflows/materialize-public-experience-v3.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: local-public-experience-v3-${{ github.repository }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Stage source assets behind the protected workflow boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact protected rollout tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: e99f628b78458ad9560e8e06ed6cb795f1871c0c
          path: tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prove controller contracts offline
        working-directory: tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/rollout_holographic_spaces_v2.py \
            .github/scripts/run_holographic_spaces_v2.py \
            .github/scripts/responsive_space_contract.py \
            .github/scripts/holographic_target_contract.py
          node --check design/holographic-v2/szl-space-hologram.js
          node --check design/responsive-v3/szl-responsive-v3.js
          python .github/tests/test_holographic_spaces_v2.py
          python .github/tests/test_responsive_space_contract.py
          python .github/tests/test_holographic_target_contract.py

      - name: Stage the repository-local review branch
        working-directory: tooling
        shell: bash
        env:
          SZL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_filter="${GITHUB_REPOSITORY#*/}"
          report="${RUNNER_TEMP}/public-experience-v3-${repo_filter}.json"
          python .github/scripts/run_holographic_spaces_v2.py \
            --org szl-holdings \
            --repo-filter "${repo_filter}" \
            --max-repos 500 \
            --assets-root design/holographic-v2 \
            --report "${report}" \
            --apply
          python - "${report}" "${GITHUB_REPOSITORY}" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = sys.argv[2]
          if report.get('secrets_recorded') is not False:
              raise SystemExit('secret-recording invariant failed')
          if report.get('default_branch_writes') is not False or report.get('force_pushes') is not False:
              raise SystemExit('source-control safety invariant failed')
          rows = [row for row in report.get('repositories', []) if row.get('repository') == expected]
          if len(rows) != 1:
              raise SystemExit(f'expected one result for {expected}, found {len(rows)}')
          row = rows[0]
          if row.get('status') in {'pull-opened', 'pull-existing', 'already-integrated'}:
              print(json.dumps(row, indent=2, sort_keys=True))
              raise SystemExit(0)
          error = row.get('error') or {}
          details = error.get('details') or {}
          response = details.get('response') or {}
          message = str(error.get('message') or '')
          expected_boundary = (
              row.get('status') == 'blocked'
              and error.get('code') == 'GITHUB_HTTP_ERROR'
              and details.get('status') == 403
              and response.get('message') == 'Resource not accessible by integration'
              and '/contents/.github/workflows/szl-holographic-space-v2.yml' in message
          )
          if not expected_boundary:
              raise SystemExit(json.dumps(row, indent=2, sort_keys=True))
          print('Staged ordinary source files; protected workflow completion is delegated to the authenticated maintainer path.')
          print(json.dumps(row, indent=2, sort_keys=True))
          PY
