name: Public Experience Frontier v4

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-experience-frontier:
    name: Public Experience Frontier v4
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact product source event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Verify exact product source event
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"

      - name: Checkout organization UX policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: main
          persist-credentials: false
          path: policy

      - name: Enforce mobile/accessibility contract
        run: |
          python policy/scripts/check_public_experience_v4.py \
            target/index.html \
            target/szl-space-hologram.css
